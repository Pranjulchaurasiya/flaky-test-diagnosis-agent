name: Run Flaky Test Evaluation Benchmark

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Evaluation Mode (full, baseline, agent)'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - baseline
          - agent

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Flaky Test Evaluation Benchmark
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python eval/run_eval.py --mode ${{ inputs.mode || 'full' }}

      - name: Run Trajectory Verification Audit
        run: |
          python eval/audit_all_trajectories.py

      - name: Publish Step Summary to GitHub Actions UI
        if: always()
        run: |
          echo "## 📊 Flaky Test Diagnosis Benchmark Results" >> $GITHUB_STEP_SUMMARY
          if [ -f "eval/results.json" ]; then
            python -c "
          import json
          with open('eval/results.json') as f:
              data = json.load(f)
          print(f'**Total Cases**: {data.get(\"total_cases\", 0)}')
          print(f'**Baseline Accuracy**: {data.get(\"baseline_accuracy\", \"N/A\")}')
          print(f'**Agent Accuracy**: {data.get(\"agent_accuracy\", \"N/A\")}')
          print(f'**Agent Evidence Verification Rate**: {data.get(\"agent_verification_rate\", \"N/A\")}')
          print('\n| Case ID | Name | Category | Baseline | Agent | Verification | Evidence Citation |')
          print('|---|---|---|---|---|---|---|')
          for r in data.get('results', []):
              b_pass = '✅ ' + r.get('baseline', {}).get('predicted_category', '') if r.get('baseline', {}).get('is_correct') else '❌ Fail'
              a_pass = '✅ ' + r.get('agent', {}).get('predicted_category', '') if r.get('agent', {}).get('is_correct') else '❌ Fail'
              v_stat = r.get('agent', {}).get('verification_status', 'N/A')
              cite = r.get('agent', {}).get('evidence_citation', {})
              cite_str = f\"{cite.get('file_path', '')}:{cite.get('line_number', '')}\" if cite.get('file_path') else 'N/A'
              print(f\"| \`{r['id']}\` | {r['name']} | \`{r['ground_truth_category']}\` | {b_pass} | {a_pass} | **{v_stat}** | \`{cite_str}\` |\")
          " >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Evaluation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-and-trajectories
          path: |
            eval/results.json
            trajectories/*.json
