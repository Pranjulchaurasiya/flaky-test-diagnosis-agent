[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flakyguard"
version = "1.0.0"
description = "Autonomous CI Diagnostic Agent for Non-Deterministic Tests"
readme = "README.md"
authors = [{ name = "Pranjul Chaurasiya" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pytest>=8.3.3",
    "pytest-xdist>=3.8.0",
    "pydantic>=2.13.4",
    "groq>=1.2.0",
    "python-dotenv>=1.2.3",
    "requests>=2.32.0"
]

[project.scripts]
flakyguard = "agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "mcp*"]

[project.urls]
Homepage = "https://github.com/Pranjulchaurasiya/flaky-test-diagnosis-agent"
Documentation = "https://pranjulchaurasiya.github.io/flaky-test-diagnosis-agent/"
